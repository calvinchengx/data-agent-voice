# Lint, types and the checks that hold this repository's configuration to
# itself. There is no runtime here yet -- the four extensions the graph names
# are the next commit -- so what CI can prove is that the files agree, and it
# proves exactly that and no more (docs/parity.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # What kind of change is this? The image jobs cost about nine minutes of
  # runner time between them, and a typo in a document cannot break an image.
  # So they are gated on something outside the documentation having moved.
  #
  # The gate FAILS OPEN. If the base commit cannot be determined -- a first
  # push, a force push, a re-run -- it reports `code` and everything runs. A
  # gate that guesses "docs only" when it does not know is a gate that skips
  # the build on the one commit that needed it.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.what.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: what
        shell: bash
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            pull_request) base="${{ github.event.pull_request.base.sha }}" ;;
            push)         base="${{ github.event.before }}" ;;
            *)            base="" ;;
          esac
          kind=$(python3 scripts/changed_kind.py "$base")
          if [ "$kind" = "docs" ]; then
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Docs-only change::the image jobs are skipped; nothing outside docs/, website/, site/ or the top-level documents moved"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  quality:
    name: Lint, and the configuration held to itself
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install 3.12
      # The panel's arithmetic is JavaScript and is exercised by the same
      # suite; without node those checks skip visibly rather than pass.
      - uses: actions/setup-node@v7
        with:
          node-version: '22'


      # Every gate runs, so one push reports everything wrong rather than the
      # first thing wrong. The repository next door lost three round trips a
      # day to a job that stopped at the first failure.
      - name: Ruff
        if: ${{ !cancelled() }}
        run: uv run --with ruff ruff check .
      - name: Format
        if: ${{ !cancelled() }}
        run: uv run --with ruff ruff format --check .
      - name: The configuration agrees with itself
        if: ${{ !cancelled() }}
        run: uv run --with pytest --with pytest-cov --with pydantic --with httpx python -m pytest -q
      - name: The recorded witness count is the one the suite proves
        if: ${{ !cancelled() }}
        run: uv run --with pytest --with pytest-cov --with pydantic --with httpx python scripts/witnesses.py --check
      - name: The sidebar and docs/ agree, on what is committed
        if: ${{ !cancelled() }}
        run: python3 scripts/check_docs_nav.py
      - name: The compose file parses and its pins resolve
        if: ${{ !cancelled() }}
        run: |
          cp .env.example .env
          docker compose config -q
          echo "compose ok"

  image:
    name: The image builds (${{ matrix.arch }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners per architecture rather than one job emulating the
          # other. The arm64 leg under QEMU on an amd64 runner took over ten
          # minutes and was still going; natively it is about four. GitHub
          # provides arm runners free for public repositories, and the two
          # legs are genuinely independent -- fail-fast off, so a break in one
          # still reports the other.
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      # Skipped, visibly, until every extension the graph names exists: the
      # build cannot succeed without them, and a job that is red on every push
      # teaches people to stop reading CI. It starts building by itself the
      # moment the last one lands.
      #
      # "Any extension exists" was the wrong question -- the build needs EVERY
      # one -- and a job-level `if` was the wrong place, because `hashFiles`
      # reads the workspace and is evaluated before checkout.
      - id: ready
        shell: bash
        run: |
          if reason=$(python3 scripts/image_ready.py); then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Image not built::$reason — the graph names extensions this repository has not written yet. See docs/parity.md."
          fi
      - if: steps.ready.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3
      - name: Build
        if: steps.ready.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/ten/Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      # The image is only useful if it starts. Three things it needed and did
      # not announce -- LOG_PATH, a 32-character AGORA_APP_ID, and the Python
      # dependencies that a `find` over symlinks silently missed -- all built
      # green and failed here.
      - name: The server starts and registers the graph
        if: steps.ready.outputs.build == 'true'
        shell: bash
        run: |
          docker buildx build --platform ${{ matrix.platform }} \
            -f docker/ten/Dockerfile -t das-voice:ci --load .
          docker run --rm -d --name ci-smoke -e ANTHROPIC_API_KEY=stub das-voice:ci
          for i in $(seq 1 30); do
            docker exec ci-smoke curl -fsS http://localhost:8080/health >/dev/null 2>&1 && break
            sleep 2
          done
          docker exec ci-smoke curl -fsS http://localhost:8080/graphs | tee /dev/stderr | grep -q analyst_line
          docker rm -f ci-smoke
