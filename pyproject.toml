[project]
name = "data-agent-voice"
version = "0.1.0"
description = "The Analyst Line: a voice front end over data-agent-service"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.16",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# check_docs_nav.py and check_links.py are gates, not libraries: the docs-site
# workflow runs each as a subprocess against the assembled site, which is the
# only place they can be meaningfully exercised -- a unit test would have to
# rebuild the site to say anything, and would then be a second, worse statement
# of what the job already proves. Same precedent as data-agent-service excluding
# its conformance harnesses for the same reason.
[tool.coverage.run]
omit = [
    "scripts/check_docs_nav.py",
    "scripts/check_links.py",
]
