[project]
name = "data-agent-voice"
version = "0.1.0"
description = "The Analyst Line: a voice front end over data-agent-service"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.16",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Files taken unchanged from the pinned TEN tag. Formatting them would make
# them differ from upstream for no reason a reader could act on, and
# `make vendor-check` would then report a difference with no PR behind it --
# which is exactly the signal that rule exists to keep meaningful. A patch to
# a vendored file is deliberate, reviewed, and carries a VENDORED entry.
extend-exclude = ["tenapp/scripts/", "extensions/vendor/", "extensions/das_host/agent/", "extensions/das_host/helper.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# check_docs_nav.py and check_links.py are gates, not libraries: the docs-site
# workflow runs each as a subprocess against the assembled site, which is the
# only place they can be meaningfully exercised -- a unit test would have to
# rebuild the site to say anything, and would then be a second, worse statement
# of what the job already proves. Same precedent as data-agent-service excluding
# its conformance harnesses for the same reason.
[tool.coverage.run]
omit = [
    "scripts/check_docs_nav.py",
    "scripts/check_links.py",
    # Modules that import the TEN runtime. It is not a pip package -- it is
    # installed by `tman` into the image and exists nowhere else (docs/05-ten.md
    # §7) -- so a unit test cannot import these at all, and a stub of the
    # runtime would be a test of the stub. What exercises them is the image
    # build and a running graph, and docs/parity.md records both as not run
    # rather than letting a number imply otherwise. `descriptor.py` is
    # deliberately free of that dependency so the rule §16 rests on IS testable.
    "extensions/*/addon.py",
    "extensions/*/extension.py",
    "extensions/das_host/agent/*",
    "extensions/das_host/helper.py",
    "extensions/local_tts/config.py",
    "extensions/local_tts/client.py",
]
